<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> K_M_G PANELL</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body> <div class="digital-grid"></div>
<div class="particles"></div>
  
  <div class="neon-light light1"></div>
<div class="neon-light light2"></div>
<div class="neon-light light3"></div>

    <header>
        <h1>📋 سیستم گزارش</h1>

        <button id="darkMode">🌙 دارک مود</button>
    </header>

    <main>

        <section class="cards">

            <div class="card">
                <h2>📝 ثبت گزارش</h2>
                <p>گزارش خود را برای ما ارسال کنید.</p>
            </div>

            <a href="messages.html" class="card message-link">

    <h2>💬 پیام‌ها</h2>

    <p>
        پیام‌های دریافتی خود را مشاهده کنید.
    </p>

            </a>

            <div class="card">
                <h2>📢 اطلاعیه های KMG</h2>
                <p>آخرین اطلاعیه‌ها را مشاهده کنید.</p>
            </div>

        </section>


        <section class="report">

            <h2>📝ثبت گزارش تعلیقی اکانت روبیکا و رفع تعلیقی اکانت</h2>

            <input
                type="text"
                id="name"
                placeholder="نام شما"
            >

            <textarea
                id="message"
                placeholder="گزارش خود را بنویسید..."
            ></textarea>

            <button id="sendReport">
                ارسال گزارش 🚀
            </button>

            <p id="result"></p>

        </section>

    </main>

    <script src="script.js"></script>
